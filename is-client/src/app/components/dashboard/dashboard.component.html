<app-menu pageTitle="Dashboard"></app-menu>

<div class="main-layout">
  <div class="header-container">
    <span class="header">Bible Studies</span>
    <div class="button-container">
      <button pButton (click)="newStudy()" class="is-button">New Study</button>
    </div>
  </div>

  <div class="elevated table-container">
    <p-table [value]="studies" class="team-table">
      <ng-template pTemplate="header">
        <tr class="row-height">
          <th class="header-cell" style="width: 50px">Delete</th>
          <th class="header-cell" pSortableColumn="name">Name <p-sortIcon field="name"></p-sortIcon></th>
          <th class="header-cell" pSortableColumn="method">Method <p-sortIcon field="method"></p-sortIcon></th>
          <th class="header-cell" pSortableColumn="description">Description <p-sortIcon field="description"></p-sortIcon></th>
          <th class="header-cell" style="width: 100px" pSortableColumn="createdDate">Created <p-sortIcon field="createdDate"></p-sortIcon></th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-study>
        <tr class="row-height">
          <td class="table-cell" style="width: 50px" (click)="removeStudy(study.id)"><i class="pi pi-trash"></i></td>
          <td class="table-cell" (click)="launchStudy(study.id)">{{ study.name }}</td>
          <td class="table-cell" (click)="launchStudy(study.id)">{{ study.method }}</td>
          <td class="table-cell" (click)="launchStudy(study.id)">{{ study.description }}</td>
          <td class="table-cell" style="width: 100px" (click)="launchStudy(study.id)">{{ study.createdDate | date:'M/d/yyyy' }}</td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
