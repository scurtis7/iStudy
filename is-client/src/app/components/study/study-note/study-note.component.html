<div class="body" *ngIf="!noteMinimized">
  <div class="button-container">
    <i *ngIf="true" (click)="minimizeNote()" class="pi pi-minus show-hide-icon"></i>
    <button pButton (click)="saveNote()" class="is-button study-note-button">Save Note</button>
    <button pButton (click)="deleteNote()" class="is-button study-note-button">Delete Note</button>
  </div>
  <div class="verse-container">
    <input [(ngModel)]="verse" class="form-control verse-input" type="text">
  </div>
  <div class="note-container">
    <textarea [(ngModel)]="note" class="form-control note-text"></textarea>
  </div>
</div>
<div class="minimized" *ngIf="noteMinimized">
  <i *ngIf="true" (click)="minimizeNote()" class="pi pi-plus show-hide-icon"></i>
  <input [(ngModel)]="verse" class="form-control verse-input" type="text">
</div>
